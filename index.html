<html>
    <head>
        <title>Sketch Analyzer AI</title>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
        <style>
            body {
                background-color: #f4f0e8;
                color: #2a2a2a;
                font-family: 'special elite', cursive;
                text-align: center ;
                padding: 40px;
                background-image: url("https://www.transparenttextures.com/patterns/paper.png");
                 }
                 h1 {
                    font-family: 'Caveat', cursive;
                    color: #2a2a2a;
                    font-size: 64px; 
                    margin-bottom: 20px; 
                 }
                 input {
                    margin-top: 20px; 
                    padding: 10px 20px; 
                    background-color: #e8e0d0;
                    color: #2a2a2a;
                    border: 2px solid #8a7a6a;
                    border-radius: 5px;
                     cursor: pointer;
                 }
                 img {
                    margin-top: 20px;
                    border-radius: 12px;
                    border: 2px solid #444;
                 }
                    #result {
                        color: #2a2a2a;
                        margin-top: 30px;
                        text-align: left;
                        max-width: 600px;
                        margin-left: auto;
                        margin-right: auto;
                        line-height: 1.6;
                    }

                    #loading {
                        margin-top: 20px;
                        font-family: 'Caveat', cursive;
                        font-size: 24px;
                        color: #8a7a6a;
                    }

                    #rating-card {
                        margin-top: 30px;
                        font-family: 'Caveat', cursive;
                        font-size: 80px;
                        color: #2a2a2a;
                        border: 3px solid #2a2a2a;
                        display: inline-block;
                        padding: 20px 40px;
                        border-radius: 12px;
                        background: #ede8dc;
                        box-shadow: 4px 4px 0px #8a7a6a;
                    }
        </style>
    </head>
    
    <body>
        <h1>Sketch Analyzer AI</h1>
        <p>Upload your sketch and get feedback!</p>
        <input type="file" accept="image/*">
        <img id="preview" src="" width="300">
        <div id="loading" style="display:none;">
            ✏️Analyzing your sketch... 
        </div>
        <div id="rating-card" style="display:none;"> 
            <div id="rating-number">8</div>
            <span>/10</span>
        </div>
        <div id="result">
        </div>
        
        <script src="config.js"></script>
        <script>
        const input = document.querySelector('input')
        const preview = document.querySelector('#preview')

        input.addEventListener('change', function() {
            const file = input.files[0]
            const url = URL.createObjectURL(file)
            preview.src = url
            document.querySelector('#loading').style.display = 'block'
            document.querySelector('#result').innerText = ''
            analyzeSketch(file)
        })
        
        async function analyzeSketch(file) {
            const reader = new FileReader()

            reader.onload = async function() {
                const base64 = reader.result.split(',')[1]

                const response = await fetch(
                    'https://api.groq.com/openai/v1/chat/completions',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            model: "meta-llama/llama-4-scout-17b-16e-instruct",
                            messages: [{
                                role: "user",
                                content: [
                                    { type: "text", text: "Analyze this sketch and give: 1) Rating out of 10, 2) What to improve, 3) Is this AI generated or human made?" },
                                    { type: "image_url", image_url: { url: `data:${file.type};base64,${base64}` } }
                            ]
                            }]
                        })
                        }

                    )
                const data = await response.json()
                console.log(data)
                const text = data.choices[0].message.content
                document.querySelector('#result').innerHTML = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>')
                document.querySelector('#loading').style.display = 'none'

                const ratingMatch = text.match(/(\d+)\/10/)
                if (ratingMatch) {
                    document.querySelector('#rating-number').innerText = ratingMatch[1]
                    document.querySelector('#rating-card').style.display = 'inline-block'
                }
            }
            reader.readAsDataURL(file)
            }
    </script>
    </body>
</html>
